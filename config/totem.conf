# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Pointing device emulation
CONFIG_ZMK_POINTING=y

# --- BLE split tuning ---
# Disable the aggregate experimental flag and only keep the PHY change.
# This avoids any security side-effects while still using 1M PHY for reliability.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n
CONFIG_BT_CTLR_PHY_2M=n

# Max out TX power on both halves (docs explicitly recommend this for split issues).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

